<!DOCTYPE html>
<html>
<head>
    <title>Calculateur IMC</title>
    <link rel="stylesheet" href="static/style.css">
</head>

<body>

<h1>Calculateur d'IMC</h1>

<form action="calculer" method="post">

    <label>Poids (kg)</label>
    <input type="number" step="0.1" name="poids" required>

    <label>Taille (m)</label>
    <input type="number" step="0.01" name="taille" required>

    <button type="submit">Calculer</button>

</form>

{% if imc %}
<h2>Votre IMC : {{ imc }}</h2>
<p>Interprétation : {{ interpretation }}</p>
{% endif %}

</body>
</html>
