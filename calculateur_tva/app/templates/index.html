<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="static/style.css">
    <title>Calculateur de TVA</title>
</head>
<body>
    <div class="container">
        <h1>Calculateur de TVA</h1>
        <form action="calculate" method="post">
            <input type="number" step="0.01" name="amount" placeholder="Montant" required>
            <select name="rate">
                <option value="20">20% (Normal)</option>
                <option value="10">10% (Intermédiaire)</option>
                <option value="5.5">5.5% (Réduit)</option>
            </select>
            <select name="calc_type">
                <option value="ht_to_ttc">HT vers TTC</option>
                <option value="ttc_to_ht">TTC vers HT</option>
            </select>
            <button type="submit">Calculer</button>
        </form>

        {% if result %}
        <div class="result">
            <p><strong>{{ label }} :</strong> {{ result }} €</p>
            <p><strong>Montant TVA :</strong> {{ tva }} €</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
