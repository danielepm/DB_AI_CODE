<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire de contact</title>

    <!-- Lien vers le CSS -->
    <link rel="stylesheet" href="static/style.css">
</head>

<body>

<div class="container">

    <h2>Formulaire de contact</h2>

    <!-- Message succès -->
    {% if success %}
    <p class="success">{{ success }}</p>
    {% endif %}

    <!-- Messages erreurs -->
    {% if errors %}
    <ul class="errors">
        {% for error in errors %}
        <li>{{ error['msg'] }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <!-- Formulaire -->
    <form action="submit" method="post">

        <label for="name">Nom</label>
        <input 
            type="text" 
            id="name" 
            name="name" 
            placeholder="Votre nom"
            required
        >

        <label for="email">Email</label>
        <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="votre@email.com"
            required
        >

        <label for="message">Message</label>
        <textarea 
            id="message" 
            name="message" 
            rows="5"
            placeholder="Votre message..."
            required
        ></textarea>

        <button type="submit">Envoyer</button>

    </form>

</div>

</body>
</html>
