<!DOCTYPE html>

<head>
    <title>Gestionnaire de contacts</title>

<body>

<h1>Gestionnaire de contacts</h1>

<button onclick="addContact()">Ajouter</button>

<ul id="contacts"></ul>

<script src="/static/script.js"></script>

</body>
