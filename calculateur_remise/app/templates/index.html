<!DOCTYPE html>
<html>
<head>
    <title>Calculateur de Remise</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input, select, button { width: 100%; margin: 10px 0; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        .res { margin-top: 20px; padding: 10px; background: #e2f3e5; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Calculateur 💸</h2>
        <form action="calculer" method="post">
            <input type="number" step="0.01" name="prix_initial" placeholder="Prix initial (€)" required>
            <input type="number" step="0.01" name="valeur_remise" placeholder="Valeur (ex: 20)" required>
            <select name="type_remise">
                <option value="pourcentage">Pourcentage (%)</option>
                <option value="fixe">Montant fixe (€)</option>
            </select>
            <button type="submit">Calculer</button>
        </form>

        {% if resultat is defined %}
        <div class="res">
            <p>Nouveau prix : <strong>{{ resultat }} €</strong></p>
            <p>Économie : {{ economie }} €</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
