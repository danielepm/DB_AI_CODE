<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Calculatrice</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <div class="calculator">
        <h1>Calculatrice</h1>

        <input type="number" id="a" placeholder="Nombre A">
        <input type="number" id="b" placeholder="Nombre B">

        <div class="buttons">
            <button onclick="calculate('add')">+</button>
            <button onclick="calculate('sub')">−</button>
            <button onclick="calculate('mul')">×</button>
            <button onclick="calculate('div')">÷</button>
        </div>

        <p id="result">Résultat : </p>
    </div>

    <script src="{{ url_for('static', path='js/calculator.js') }}"></script>
</body>
</html>
