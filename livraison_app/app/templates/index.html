<!DOCTYPE html>
<html>
<head>
    <title>Calculateur de Livraison</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded shadow-md w-96">
        <h1 class="text-2xl font-bold mb-4 text-blue-600">Frais de Port</h1>
        <form action="calculer" method="post">
            <label class="block mb-2">Poids (kg)</label>
            <input type="number" step="0.1" name="poids" class="border w-full p-2 mb-4" required>
            
            <label class="block mb-2">Zone de destination</label>
            <select name="zone" class="border w-full p-2 mb-4">
                {% for z in zones %}
                <option value="{{ z }}">{{ z }}</option>
                {% endfor %}
            </select>
            
            <button type="submit" class="bg-blue-500 text-white w-full py-2 rounded">Calculer</button>
        </form>
        {% if resultat %}
        <div class="mt-6 p-4 bg-green-100 text-green-700 font-bold text-center">
            Total : {{ resultat }}
        </div>
        {% endif %}
    </div>
</body>
</html>
